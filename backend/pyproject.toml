[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spotter-backend"
version = "0.1.0"
description = "Weather-aware truck route planning API and risk evaluation engine"
requires-python = ">=3.11"
dependencies = [
    "Django>=5.1,<6.0",
    "djangorestframework>=3.15",
    "django-cors-headers>=4.6",
    "drf-spectacular>=0.28",
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
    "dj-database-url>=2.3",
    "redis>=5.2",
    "django-redis>=5.4",
    "celery>=5.4",
    "gunicorn>=23.0",
    "whitenoise>=6.8",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "respx>=0.22",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "config*", "domain*", "infrastructure*", "providers*", "services*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast deterministic domain or utility unit tests",
    "integration: Django API, database, or provider adapter integration tests",
    "security: access control, validation, and fail-closed security tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    "*/migrations/*",
    ".venv",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["migrations/"]
